spring.application.name=backend

# HTTP
server.port=8080

# H2 file database (transcript log). Created under backend/data/ when run from backend/.
spring.datasource.url=jdbc:h2:file:./data/chatdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# rag-service (Contract B)
rag.service.url=http://localhost:8000
rag.service.read-timeout=120s
